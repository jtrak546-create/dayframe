<meta name="theme-color" content="#11151c" id="themeColor">
<meta name="description" content="时钟、紧凑月历、倒数日、正数日、任务与番茄钟，适合副屏和 Safari 全屏展示。">
<title>副屏仪表盘</title>
<script>
(function () {
  var t = null, skin = 'editorial';
  try {
    t = JSON.parse(localStorage.getItem('dash:theme:v1') || 'null');
    var saved = JSON.parse(localStorage.getItem('dash:skin:v1') || 'null');
    if (saved === 'day') skin = 'day';
  } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-skin', skin);
})();
</script>

/* Date counters */
.milestones { grid-area: milestones; display: flex; flex-direction: column; }
.milestones .phead { margin-bottom: 6px; flex: none; }
.milestone-add { min-height: 44px; color: var(--fg-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
.milestone-add:hover { color: var(--fg); border-color: var(--focus); }
.milestone-list { display: grid; gap: 8px; overflow: auto; min-height: 0; align-content: start; max-height: 264px; }
.milestone-card { display: flex; align-items: stretch; min-height: 66px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); overflow: hidden; flex-shrink: 0; }
.milestone-edit { display: flex; flex: 1; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; text-align: left; min-width: 0; color: var(--fg); }
.milestone-edit:hover { background: var(--line); }
.milestone-info { min-width: 0; display: grid; gap: 5px; }
.milestone-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.milestone-date { overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.milestone-value { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; flex-wrap: wrap; color: var(--focus); text-align: right; flex: none; }
.milestone-card[data-type="countup"] .milestone-value { color: var(--rest); }
.milestone-number { font-family: var(--f-num); font-size: clamp(24px, 3vw, 34px); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.milestone-unit { font-size: 11px; }
.milestone-status { font-size: 13px; font-weight: 600; }
.milestone-delete { width: 40px; min-height: 44px; padding: 0 6px; color: var(--fg-3); font-size: 18px; }
.milestone-delete:hover { color: var(--fg); background: var(--line); }
.milestone-empty { min-height: 66px; border: 1px dashed var(--line); border-radius: 11px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--fg-2); }
.milestone-empty:hover { border-color: var(--focus); }
.milestone-empty strong { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.milestone-empty small { color: var(--fg-3); font-size: 11px; }
.milestone-empty b { color: var(--fg-3); font-size: 24px; font-weight: 300; }
.milestone-overlay { position: fixed; inset: 0; z-index: 100; padding: 20px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.52); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.milestone-overlay[hidden] { display: none; }
.milestone-dialog { width: min(100%, 390px); max-height: calc(100vh - 40px); overflow: auto; border-radius: 18px; padding: 22px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0,0,0,.25); }
.milestone-dialog h2 { font-size: 17px; font-weight: 600; }
.milestone-close { color: var(--fg-2); font-size: 24px; width: 44px; height: 44px; }
.milestone-field { display: grid; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--fg-2); }
.milestone-field input, .milestone-field select { width: 100%; min-width: 0; min-height: 43px; padding: 9px 11px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 16px; color-scheme: inherit; }
.milestone-include { display: flex; gap: 8px; align-items: center; margin-top: 15px; color: var(--fg-2); font-size: 12px; }
.milestone-include[hidden] { display: none; }
.milestone-include input { accent-color: var(--rest); }
.milestone-error { color: var(--focus); min-height: 18px; margin-top: 12px; font-size: 12px; }
.milestone-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.milestone-actions button { min-width: 72px; border-radius: 9px; padding: 10px 16px; font-weight: 600; }
.milestone-cancel { background: var(--panel-2); color: var(--fg-2); border: 1px solid var(--line); }
.milestone-save { background: var(--focus); color: var(--focus-ink); }
body.milestone-modal-open { overflow: hidden; }

/* Two independent skins share the same dashboard state and controls. */
:root {
  --f-num: "Frame Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body: "Frame Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-title: "Frame Serif", "Songti SC", "Noto Serif CJK SC", serif;
  --bg: #1b1b1a; --panel: #252522; --panel-2: #32322e; --line: #41413a;
  --fg: #f0efe9; --fg-2: #b8b8ae; --fg-3: #a0a095;
  --focus: #d99476; --focus-ink: #21140e; --rest: #91ad93; --rest-ink: #132018;
  --shadow: transparent; color-scheme: dark;
}
:root[data-skin="editorial"][data-theme="light"] {
  --bg: #f8f7f4; --panel: #fffefa; --panel-2: #eeede8; --line: #dcdcd3;
  --fg: #252622; --fg-2: #62665c; --fg-3: #6c7165;
  --focus: #b55b3d; --focus-ink: #fff; --rest: #52715c; --rest-ink: #fff;
  color-scheme: light;
}
:root[data-skin="day"] {
  --bg: #19201b; --panel: #242e27; --panel-2: #303c33; --line: #3c493e;
  --fg: #ebf0e6; --fg-2: #b0bdae; --fg-3: #a2b09f;
  --focus: #91ad93; --focus-ink: #15221a; --rest: #aabf91; --rest-ink: #172012;
  --shadow: #00000014; color-scheme: dark;
}
:root[data-skin="day"][data-theme="light"] {
  --bg: #f1f1e9; --panel: #fffefa; --panel-2: #edeee6; --line: #dde1d6;
  --fg: #28352d; --fg-2: #626f60; --fg-3: #626f60;
  --focus: #52715c; --focus-ink: #fff; --rest: #74804d; --rest-ink: #fff;
  --shadow: #24352808; color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; margin: 0; }
html { height: 100%; }
body {
  min-height: 100%; height: 100vh; height: 100dvh;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  background: var(--bg); color: var(--fg); font: 400 15px/1.4 var(--f-body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
ul { list-style: none; padding: 0; }
.app { position: relative; height: 100%; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.topbar { display: flex; flex: none; min-height: 64px; padding-bottom: 16px; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 13px; min-height: 44px; font-family: var(--f-num); font-size: 20px; font-weight: 600; letter-spacing: -.045em; white-space: nowrap; }
.brand-mark { width: 6px; height: 28px; background: var(--focus); flex: none; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.tool-btn { min-height: 44px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.tool-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }
.tool-btn svg { width: 16px; height: 16px; flex: none; }
.skin-picker { position: relative; }
.skin-picker select { min-height: 44px; min-width: 88px; padding: 0 26px 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 13px; cursor: pointer; }
.skin-picker option { background: var(--panel); color: var(--fg); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.dash { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 185px; grid-template-areas: "pomo tasks" "cal milestones"; gap: 26px 42px; }
.date-column, .focus-column { display: contents; }
.clock { position: absolute; top: 4px; left: 220px; right: 338px; display: grid; grid-template-columns: auto minmax(0,1fr); grid-template-rows: auto auto; gap: 2px 14px; align-items: center; min-width: 0; }
.time { grid-row: 1 / 3; display: flex; align-items: baseline; gap: .05em; font-family: var(--f-num); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time .sec, .weekline { display: none; }
.dateline { display: flex; align-items: baseline; gap: 6px; font-size: 12px; line-height: 1.3; white-space: nowrap; }
.dateline .wd { color: var(--fg-2); }
.zone { display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--fg-3); white-space: nowrap; }

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brandName">Day / Frame</span></div>
    <div class="top-actions">
      <label class="skin-picker"><span class="sr-only">选择皮肤</span><select id="skinSelect" aria-label="选择皮肤"><option value="editorial">字间</option><option value="day">日光</option></select></label>
      <button class="tool-btn" type="button" id="themeToggle" aria-label="切换到日间模式">
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>
        <span id="themeLabel">日间模式</span>
      </button>
      <button class="tool-btn" type="button" id="fullscreenToggle" aria-pressed="false" aria-controls="fullscreenTip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        <span id="fullscreenLabel">全屏</span>
      </button>
    </div>
  </header>
<main class="dash">
  <div class="date-column">
  <section class="clock" aria-label="当前时间">
    <div class="time" aria-hidden="false"><span id="hm">--:--</span><span class="sec" id="ss">--</span></div>
    <div class="dateline"><span class="big" id="dayBig"></span><span class="wd" id="wday"></span></div>
    <div class="weekline" id="wk"></div>
    <div class="zone" id="zone"><span id="zLabel">东京</span><span class="zt" id="zTime">--:--</span><span id="zDiff"></span></div>
  </section>

  <section class="panel cal" aria-label="月历">
    <div class="phead">
      <span class="ctitle" id="calTitle"></span>
      <div class="cal-month"><b id="calMonth">10</b><small id="calYear">2026</small></div>
      <div class="calnav">
        <button type="button" id="calPrev" aria-label="上个月"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="calToday">今天</button>
        <button type="button" id="calNext" aria-label="下个月"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel milestones" aria-labelledby="milestoneHeading">
    <div class="phead">
      <h2 id="milestoneHeading">倒数日 · 正数日</h2>
      <button type="button" class="milestone-add" id="milestoneAdd" aria-label="添加倒数日或正数日">＋ 添加</button>
    </div>
    <div class="milestone-list" id="milestoneList"></div>
  </section>

  <div class="milestone-overlay" id="milestoneOverlay" hidden>
    <section class="milestone-dialog" role="dialog" aria-modal="true" aria-labelledby="milestoneDialogTitle" tabindex="-1">
      <div class="phead">
        <h2 id="milestoneDialogTitle">添加日期</h2>
        <button type="button" class="milestone-close" id="milestoneClose" aria-label="关闭日期设置">×</button>
      </div>
      <form id="milestoneForm" novalidate>
        <label class="milestone-field">计数方式
          <select id="milestoneType"><option value="countdown">倒数日 · 距离目标</option><option value="countup">正数日 · 从这天开始</option></select>
        </label>
        <label class="milestone-field">名称
          <input id="milestoneTitle" type="text" maxlength="40" placeholder="例如：旅行出发 / 坚持阅读" required autocomplete="off">
        </label>
        <label class="milestone-field"><span id="milestoneDateLabel">目标日期</span>
          <input id="milestoneDate" type="date" min="1900-01-01" max="9999-12-31" required>
        </label>
        <label class="milestone-include" id="milestoneIncludeWrap"><input id="milestoneInclude" type="checkbox"> 起始当天算第 1 天</label>
        <p class="milestone-error" id="milestoneError" role="alert"></p>
        <div class="milestone-actions">
          <button type="button" class="milestone-cancel" id="milestoneCancel">取消</button>
          <button type="submit" class="milestone-save">保存</button>
        </div>
      </form>
    </section>
  </div>

  </div>
  <div class="focus-column">
  <section class="panel pomo" id="pomo" data-mode="focus" aria-label="番茄钟">
    <div class="pomo-heading"><h2 id="pomoTitle">专注 / FOCUS</h2>      <div class="seg" role="group" aria-label="计时模式">
        <button type="button" data-mode="focus" aria-pressed="true">专注</button>
        <button type="button" data-mode="short" aria-pressed="false">短休</button>
        <button type="button" data-mode="long" aria-pressed="false">长休</button>
      </div></div>
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="trk" cx="100" cy="100" r="88"/>
        <circle class="prg" id="prg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)" stroke-dasharray="552.92" stroke-dashoffset="0"/>
      </svg>
      <div class="rtxt"><span class="pm" id="pmode">专注</span><span class="pc" id="pclock">25:00</span></div>
      <div class="linear-timer" aria-hidden="true"><i id="pLine"></i></div>
    </div>
    <div class="pside">

      <div class="ptarget" id="ptarget"></div>
      <div class="pnote" id="pnote" aria-live="polite" hidden></div>
      <div class="pctl">
        <button type="button" class="go" id="pGo">开始</button>
        <button type="button" class="ghost" id="pReset">重置</button>
        <button type="button" class="ghost" id="pSkip">跳过</button>
      </div>

    </div>
      <div class="pmeta">
        <div class="p-rounds"><div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <span id="pCount">今日 0 轮</span></div>
        <span class="len">
          <button type="button" id="lenDown" aria-label="减少时长"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <span id="lenText">25 分钟</span>
          <button type="button" id="lenUp" aria-label="增加时长"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </span>
        <label class="tog" id="wakeWrap"><input type="checkbox" id="cWake"> 屏幕常亮</label>
        <label class="tog"><input type="checkbox" id="cSound"> 提示音</label>
      </div>
  </section>

  <section class="panel tasks" aria-label="今日任务">
    <div class="phead">
      <div class="headr"><h2>今日任务</h2><span class="count" id="taskCount" aria-live="polite">0 / 0</span></div>
      <span class="sync" id="sync"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>

    <ul id="taskList"></ul>
    <form class="addrow" id="addForm" autocomplete="off">
      <input id="taskInput" type="text" maxlength="80" placeholder="添加下一件要做的事" aria-label="新任务">
      <button type="submit" class="btn-solid">添加</button>
    </form>
    <div class="tfoot">
      <span>点任务名，设为当前专注</span>
      <button type="button" id="clearDone">清除已完成</button>
    </div>
  </section>
  </div>
</main>

</div>
<aside class="screen-tip" id="fullscreenTip" role="status" hidden>
  <strong>Safari 全屏显示</strong>
  <p id="fullscreenHelp"></p>
  <button type="button" id="dismissFullscreenTip">知道了</button>
</aside>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var MODE_NAME = { focus: '专注', short: '短休', long: '长休' };
  var STEP = { focus: 5, short: 1, long: 5 };
  var MIN = { focus: 5, short: 1, long: 5 };
  var MAX = { focus: 90, short: 30, long: 45 };
  var C = 552.92;
  var LS_STATE = 'dash:state:v1', LS_TIMER = 'dash:timer:v1', LS_CFG = 'dash:cfg:v1';

  function lsGet(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

  var last = {};
  function setText(id, v) { if (last[id] !== v) { last[id] = v; $(id).textContent = v; } }

  /* ---------- independent skins; light / dark stays in screen.js ---------- */
  var LS_SKIN = 'dash:skin:v1';
  var skinChoice = lsGet(LS_SKIN);
  if (skinChoice !== 'editorial' && skinChoice !== 'day') skinChoice = 'editorial';

  function refreshThemeColor() {
    var meta = $('themeColor');
    if (!meta || !window.getComputedStyle) return;
    var bg = window.getComputedStyle(document.documentElement).getPropertyValue('--bg').replace(/^\s+|\s+$/g, '');
    if (bg) meta.setAttribute('content', bg);
  }

  function applySkin() {
    document.documentElement.setAttribute('data-skin', skinChoice);
    if ($('brandName')) $('brandName').textContent = skinChoice === 'day' ? 'DAYFRAME' : 'Day / Frame';
    if ($('pomoTitle')) $('pomoTitle').textContent = skinChoice === 'day' ? '专注时间' : '专注 / FOCUS';
    var select = $('skinSelect');
    if (select) select.value = skinChoice;

  }

  var skinSelect = $('skinSelect');
  if (skinSelect) {
    skinSelect.addEventListener('change', function () {
      skinChoice = skinSelect.value === 'day' ? 'day' : 'editorial';

    $('themeLabel').textContent = light ? '夜间模式' : '日间模式';
    $('themeToggle').setAttribute('aria-label', light ? '切换到夜间模式' : '切换到日间模式');
    $('themeToggle').title = light ? '切换到夜间模式' : '切换到日间模式';

  }
  $('themeToggle').addEventListener('click', function () {
    themeChoice = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';

  if (systemTheme) {

  function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement; }

  }
  function showFullscreenHelp() {

      ? '此版本的 Safari 未能进入网页全屏。请在 Safari 的分享菜单中选择“添加到主屏幕”，再从桌面图标打开，即可隐藏 Safari 工具栏。若出现“作为网页 App 打开”，请保持开启。'
      : '未能进入网页全屏，请再点一次“全屏”。Mac 也可使用 Safari 的“显示 → 进入全屏幕”，或按 Control + Command + F。';
    $('fullscreenTip').hidden = false;
  }
  $('fullscreenToggle').addEventListener('click', function () {
    var active = fullscreenElement();

  /* ---------- state (tasks, today's rounds): local + optional private sync ---------- */
  function seedState() {
    return {
      v: 1, updated: 0, day: dayStr(), focusId: null, sessions: 0,
      tasks: [
        { id: uid(), text: '护理术语复习 20 个', done: false, pomos: 0 },
        { id: uid(), text: '日语跟读 15 分钟', done: false, pomos: 0 },
        { id: uid(), text: '回复未读消息', done: false, pomos: 0 }

  function normalize(r) {
    var t = [];
    (r.tasks || []).forEach(function (x) {

          wl = l;
          l.addEventListener('release', function () { wl = null; });
        }, function () { wl = null; });
      } else if (wl) { wl.release(); wl = null; }
    } catch (e) { wl = null; }
  }
  if (!navigator.wakeLock) $('wakeWrap').hidden = true;
  $('cWake').checked = cfg.wake;
  $('cSound').checked = cfg.sound;
  $('cWake').addEventListener('change', function () { cfg.wake = this.checked; saveCfg(); setWake(cfg.wake); });
  $('cSound').addEventListener('change', function () { cfg.sound = this.checked; saveCfg(); if (cfg.sound) { ensureAudio(); beep(); } });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (cfg.wake) setWake(true); tick(); }
  });
  document.addEventListener('pointerdown', function () { if (cfg.wake && !wl) setWake(true); }, { once: true });

  /* ---------- calendar nav ---------- */
  $('calPrev').addEventListener('click', function () { view.m -= 1; if (view.m < 0) { view.m = 11; view.y -= 1; } renderCal(); });
  $('calNext').addEventListener('click', function () { view.m += 1; if (view.m > 11) { view.m = 0; view.y += 1; } renderCal(); });
  $('calToday').addEventListener('click', function () { var n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); renderCal(); });

  /* ---------- loop ---------- */
  var lastDay = dayStr();
  function tick() {
    var now = new Date();
    renderClock(now);
    var ds = dayStr(now);
    if (ds !== lastDay) {
      lastDay = ds;
      checkDay();
      renderCal();
      renderMilestones();
    }
    if (timer.running) {
      var left = timer.endAt - Date.now();
      if (left <= 0) { timer.left = 0; complete(); }
      else { timer.left = left; renderRing(); }
    }
  }

  checkDay(true);
  renderClock(new Date());
  renderCal();
  renderTasks();
  renderPomo();
  renderMilestones();
  setInterval(tick, 250);
  initSync();
  if (cfg.wake) setWake(true);
})();
</script>
</body>
</html>
