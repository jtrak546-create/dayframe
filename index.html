<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="副屏仪表盘">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11151c" id="themeColor">
<meta name="description" content="时钟、紧凑月历、倒数日、正数日、任务与番茄钟，适合副屏和 Safari 全屏展示。">
<title>副屏仪表盘</title>
<script>
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('dash:theme:v1'));
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }

/* A compact date column and a larger focus workspace, tuned for landscape tablets. */
:root {
  --bg: #11151c;
  --panel: #1a202b;
  --panel-2: #232b39;
  --line: #2d3646;
  --fg: #e9ecf1;
  --fg-2: #aab3c2;
  --fg-3: #7d889b;
  --focus: #e5a83f;
  --focus-ink: #1c1507;
  --rest: #52bba9;
  --rest-ink: #06211d;
  --f-num: "Barlow Condensed", "DIN Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8ecf1;
    --panel: #fbfcfd;
    --panel-2: #edf0f4;
    --line: #d3dae3;
    --fg: #171e2a;
    --fg-2: #4a5568;
    --fg-3: #6b7689;
    --focus: #a8660a;
    --focus-ink: #ffffff;
    --rest: #1d8575;
    --rest-ink: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8ecf1;
  --panel: #fbfcfd;
  --panel-2: #edf0f4;
  --line: #d3dae3;
  --fg: #171e2a;
  --fg-2: #4a5568;
  --fg-3: #6b7689;
  --focus: #a8660a;
  --focus-ink: #ffffff;
  --rest: #1d8575;
  --rest-ink: #ffffff;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; }
html { height: 100%; }
body { min-height: 100%; height: 100vh; height: 100dvh; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.45 var(--f-body);
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
ul { list-style: none; padding: 0; }

.app { height: 100%; max-width: 1800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.topbar { display: flex; flex: none; min-height: 44px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 3px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: .12em; font-weight: 700; }
.brand-mark { width: 9px; height: 9px; border-radius: 50%; background: var(--focus); box-shadow: 0 0 0 5px var(--panel-2); margin: 0 4px; }
.top-actions { display: flex; gap: 8px; }
.tool-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg-2); font-size: 13px; font-weight: 500; }
.tool-btn:hover { color: var(--fg); background: var(--panel-2); }
.tool-btn:disabled { opacity: .65; }
.tool-btn svg { width: 16px; height: 16px; flex: none; }
.dash {
  flex: 1; min-height: 0;
  display: grid; gap: 12px;
  grid-template-columns: minmax(300px, .92fr) minmax(0, 1.48fr);
  grid-template-rows: minmax(0, 1fr);
}
.date-column, .focus-column { display: grid; min-width: 0; min-height: 0; gap: 12px; }
.date-column {
  grid-template-rows: minmax(154px, .8fr) minmax(208px, 1fr) minmax(196px, .9fr);
  grid-template-areas: "clock" "cal" "milestones";
}
.focus-column {
  grid-template-rows: minmax(320px, 1.03fr) minmax(310px, 1fr);
  grid-template-areas: "pomo" "tasks";
}
.clock { grid-area: clock; min-width: 0; align-self: center; padding: 2px 8px 0; }
.cal   { grid-area: cal; }
.tasks { grid-area: tasks; }
.pomo  { grid-area: pomo; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  min-width: 0;
  min-height: 0;
}
.panel h2 { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--fg-2); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

/* clock */
.time {
  display: flex; align-items: baseline; gap: .08em;
  font-family: var(--f-num); font-weight: 600;
  font-size: clamp(84px, 12vw, 148px);
  line-height: .86; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.time .sec { font-size: .3em; font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
.dateline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; }
.dateline .big { font-size: clamp(23px, 2.5vw, 30px); font-weight: 700; line-height: 1.2; }
.dateline .wd { font-size: clamp(23px, 2.5vw, 30px); font-weight: 400; color: var(--fg-2); line-height: 1.2; }
.weekline { margin-top: 2px; font-size: 13px; letter-spacing: .06em; color: var(--fg-3); }
.zone {
  margin-top: 10px; display: inline-flex; align-items: baseline; gap: 8px;
  padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 13px; color: var(--fg-2);
}
.zone .zt { font-family: var(--f-num); font-weight: 600; font-size: 19px; color: var(--fg); font-variant-numeric: tabular-nums; }

/* calendar */
.cal { display: flex; flex-direction: column; }
.cal .calnav { display: flex; align-items: center; gap: 4px; }
.cal .calnav button {
  min-width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  color: var(--fg-2); font-size: 13px; font-weight: 500; padding: 0 10px;
}
.cal .calnav button:hover { background: var(--panel-2); }
.cal .ctitle { font-size: 17px; font-weight: 700; color: var(--fg); letter-spacing: 0; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-bottom: 4px; }
.dow span { text-align: center; font-size: 12px; color: var(--fg-3); letter-spacing: .08em; padding: 2px 0; }
.dow span:nth-child(n+6) { color: var(--fg-2); }
.days {
  flex: 1; min-height: 0; display: grid; gap: 2px;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 6), minmax(20px, 1fr));
}
.cal .phead { margin-bottom: 4px; }
.d { display: grid; place-items: center; font-family: var(--f-num); font-size: 19px; font-weight: 500; border-radius: 10px; font-variant-numeric: tabular-nums; }
.d.we { color: var(--fg-2); }
.d.out { color: var(--fg-3); opacity: .55; }
.d.today { background: var(--focus); color: var(--focus-ink); font-weight: 600; opacity: 1; }

/* tasks */
.tasks { display: flex; flex-direction: column; }
.tasks .count { font-family: var(--f-num); font-weight: 600; font-size: 22px; color: var(--fg); font-variant-numeric: tabular-nums; }
.tasks .headr { display: flex; align-items: baseline; gap: 12px; }
.sync { font-size: 12px; color: var(--fg-3); }
.bar { height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; margin-bottom: 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--rest); transition: width .3s ease; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 6px; }
.addrow input {
  height: 44px; padding: 0 12px; border-radius: 10px; min-width: 0;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
  font: inherit; font-size: 16px;
}
.addrow input::placeholder { color: var(--fg-3); }
.btn-solid {
  height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700;
  background: var(--focus); color: var(--focus-ink);
}
#taskList { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.chk { width: 44px; height: 44px; display: grid; place-items: center; }
.chk i { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--fg-3); display: grid; place-items: center; color: transparent; }
.chk:hover i { border-color: var(--fg-2); }
.task.done .chk i { background: var(--rest); border-color: var(--rest); color: var(--rest-ink); }
.ttext { min-height: 44px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 16px; min-width: 0; }
.ttext .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ttext .fdot { width: 8px; height: 8px; border-radius: 50%; background: var(--focus); flex: none; display: none; }
.task.focus .fdot { display: block; }
.task.focus .tl { color: var(--focus); }
.task.done .tl { color: var(--fg-3); text-decoration: line-through; }
.ttext:disabled { color: var(--fg-3); }
.tp { font-family: var(--f-num); font-size: 16px; font-weight: 600; color: var(--fg-3); padding: 0 6px; font-variant-numeric: tabular-nums; }
.del { width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-3); border-radius: 10px; }
.del:hover { color: var(--fg); background: var(--panel-2); }
.empty { padding: 18px 4px; color: var(--fg-3); }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; font-size: 12px; color: var(--fg-3); }
.tfoot button { height: 36px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); font-size: 13px; }
.tfoot button:hover:not(:disabled) { background: var(--panel-2); }
.tfoot button:disabled { opacity: .4; }

/* pomodoro */
.pomo { --pm: var(--focus); --pm-ink: var(--focus-ink); display: grid; grid-template-columns: minmax(190px, .85fr) minmax(0, 1.15fr); grid-template-rows: 44px minmax(0, 1fr); gap: 12px 20px; align-items: center; position: relative; }
.pomo[data-mode="short"], .pomo[data-mode="long"] { --pm: var(--rest); --pm-ink: var(--rest-ink); }
.pomo-heading { grid-column: 1 / -1; align-self: start; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pomo-heading span { font-size: 12px; color: var(--fg-3); }
.ring { position: relative; width: clamp(190px, 24vw, 300px); height: clamp(190px, 24vw, 300px); align-self: center; justify-self: center; grid-column: 1; grid-row: 2; flex: none; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring .trk { fill: none; stroke: var(--line); stroke-width: 9; }
.ring .prg { fill: none; stroke: var(--pm); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rtxt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.rtxt .pm { font-size: 14px; letter-spacing: .14em; color: var(--pm); font-weight: 700; }
.rtxt .pc { font-family: var(--f-num); font-size: clamp(64px, 8vw, 98px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.pside { grid-column: 2; grid-row: 2; align-self: center; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--panel-2); border-radius: 12px; }
.seg button { height: 38px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--pm); color: var(--pm-ink); font-weight: 700; }
.seg button:disabled:not([aria-pressed="true"]) { opacity: .45; }
.ptarget { text-align: center; font-size: 14px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptarget b { color: var(--fg); font-weight: 500; }
.pnote { text-align: center; font-size: 14px; color: var(--pm); font-weight: 500; }
.pctl { display: flex; align-items: center; justify-content: center; gap: 8px; }
.pctl .go { height: 48px; min-width: 160px; flex: 1; padding: 0 22px; border-radius: 12px; background: var(--pm); color: var(--pm-ink); font-weight: 700; font-size: 16px; }
.pctl .ghost { height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); color: var(--fg-2); font-size: 14px; }
.pctl .ghost:hover { background: var(--panel-2); }
.pmeta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--fg-2); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--fg-3); }
.dots i.on { background: var(--focus); border-color: var(--focus); }
.len { display: inline-flex; align-items: center; gap: 2px; }
.len button { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: var(--fg-2); }
.len button:hover:not(:disabled) { background: var(--panel-2); }
.len button:disabled { opacity: .35; }
.len span { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.tog { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--focus); }
@media (prefers-reduced-motion: no-preference) {
  .pomo.flash .ring { animation: pulse 1.1s ease-in-out 5; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
}


.pomo .seg { position: absolute; top: 14px; right: 16px; width: 224px; }
.pomo .seg button { height: 38px; font-size: 13px; }
.pomo-heading { min-height: 44px; padding-right: 234px; }
.pomo-heading span { display: none; }
.pomo .pside { gap: 12px; }
.tasks .phead { margin-bottom: 7px; }
.tasks .bar { margin-bottom: 8px; }
.tasks .tfoot { padding-top: 4px; }
.tasks .tfoot button { height: 30px; }
.screen-tip { position: fixed; z-index: 50; top: max(66px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(410px, calc(100vw - 24px)); padding: 18px; border: 1px solid var(--focus); border-radius: 14px; background: var(--panel); box-shadow: 0 16px 70px #0004; }
.screen-tip strong { display: block; margin-bottom: 8px; }
.screen-tip p { color: var(--fg-2); font-size: 14px; line-height: 1.7; }
.screen-tip button { margin-top: 12px; min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 9px; color: var(--fg); }
@media (min-width: 901px) {
  .pomo .pctl .go { min-width: 120px; }
}
@media (min-width: 901px) and (max-height: 850px) {
  .time { font-size: clamp(88px, 10.8vw, 112px); }
  .dateline { margin-top: 10px; }
  .dateline .big, .dateline .wd { font-size: 24px; }
  .zone { margin-top: 6px; padding: 4px 10px; }
  .zone .zt { font-size: 17px; line-height: 1; }
  .ring { width: clamp(178px, 22vw, 220px); height: clamp(178px, 22vw, 220px); }
  .rtxt .pc { font-size: clamp(64px, 7vw, 88px); }
  .pomo { padding-top: 12px; padding-bottom: 12px; }
  .pomo .pside { gap: 12px; }
}
@media (min-width: 901px) and (max-height: 720px) {
  body { height: auto; min-height: 100vh; }
  .app { height: auto; }
  .dash { min-height: 628px; }
  .date-column { grid-template-rows: 166px 234px 204px; }
  .focus-column { grid-template-rows: 316px 300px; }
  .clock .time { font-size: 96px; }
  .clock .zone { display: none; }
  .pomo .ring { width: 180px; height: 180px; }
  .pomo .rtxt .pc { font-size: 64px; }
}
@media (max-width: 900px) {
  body { height: auto; min-height: 100vh; }
  .app { height: auto; }
  .dash { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "clock" "pomo" "milestones" "tasks" "cal"; }
  .date-column, .focus-column { display: contents; }
  .clock { padding: 16px 8px 8px; }
  .time { font-size: clamp(94px, 22vw, 145px); }
  .pomo { display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  .pomo-heading, .pside { width: 100%; }
  .ring { width: min(68vw, 300px); height: min(68vw, 300px); }
  .rtxt .pc { font-size: clamp(70px, 18vw, 98px); }
  #taskList { max-height: 280px; }
  .milestones { min-height: 218px; }
  .cal { min-height: 294px; }
  .days { grid-template-rows: repeat(var(--rows, 6), 32px); }
}
@media (max-width: 380px) {
  .brand { letter-spacing: 0; font-size: 12px; gap: 6px; }
  .top-actions { gap: 5px; }
  .tool-btn { padding: 0 9px; font-size: 12px; }
  .pomo .seg { width: 190px; }
  .pomo-heading { padding-right: 196px; }
  .pctl .go { min-width: 110px; }
  .pctl .ghost { padding: 0 12px; }
}

/* Date counters */
.milestones { grid-area: milestones; display: flex; flex-direction: column; }
.milestones .phead { margin-bottom: 6px; flex: none; }
.milestone-add { min-height: 44px; color: var(--fg-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
.milestone-add:hover { color: var(--fg); border-color: var(--focus); }
.milestone-list { display: grid; gap: 8px; overflow: auto; min-height: 0; align-content: start; max-height: 264px; }
.milestone-card { display: flex; align-items: stretch; min-height: 66px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); overflow: hidden; flex-shrink: 0; }
.milestone-edit { display: flex; flex: 1; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; text-align: left; min-width: 0; color: var(--fg); }
.milestone-edit:hover { background: var(--line); }
.milestone-info { min-width: 0; display: grid; gap: 5px; }
.milestone-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.milestone-date { overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.milestone-value { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; flex-wrap: wrap; color: var(--focus); text-align: right; flex: none; }
.milestone-card[data-type="countup"] .milestone-value { color: var(--rest); }
.milestone-number { font-family: var(--f-num); font-size: clamp(24px, 3vw, 34px); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.milestone-unit { font-size: 11px; }
.milestone-status { font-size: 13px; font-weight: 600; }
.milestone-delete { width: 40px; min-height: 44px; padding: 0 6px; color: var(--fg-3); font-size: 18px; }
.milestone-delete:hover { color: var(--fg); background: var(--line); }
.milestone-empty { min-height: 66px; border: 1px dashed var(--line); border-radius: 11px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--fg-2); }
.milestone-empty:hover { border-color: var(--focus); }
.milestone-empty strong { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.milestone-empty small { color: var(--fg-3); font-size: 11px; }
.milestone-empty b { color: var(--fg-3); font-size: 24px; font-weight: 300; }
.milestone-overlay { position: fixed; inset: 0; z-index: 100; padding: 20px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.52); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.milestone-overlay[hidden] { display: none; }
.milestone-dialog { width: min(100%, 390px); max-height: calc(100vh - 40px); overflow: auto; border-radius: 18px; padding: 22px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0,0,0,.25); }
.milestone-dialog h2 { font-size: 17px; font-weight: 600; }
.milestone-close { color: var(--fg-2); font-size: 24px; width: 44px; height: 44px; }
.milestone-field { display: grid; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--fg-2); }
.milestone-field input, .milestone-field select { width: 100%; min-width: 0; min-height: 43px; padding: 9px 11px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 16px; color-scheme: inherit; }
.milestone-include { display: flex; gap: 8px; align-items: center; margin-top: 15px; color: var(--fg-2); font-size: 12px; }
.milestone-include[hidden] { display: none; }
.milestone-include input { accent-color: var(--rest); }
.milestone-error { color: var(--focus); min-height: 18px; margin-top: 12px; font-size: 12px; }
.milestone-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.milestone-actions button { min-width: 72px; border-radius: 9px; padding: 10px 16px; font-weight: 600; }
.milestone-cancel { background: var(--panel-2); color: var(--fg-2); border: 1px solid var(--line); }
.milestone-save { background: var(--focus); color: var(--focus-ink); }
body.milestone-modal-open { overflow: hidden; }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>副屏仪表盘</div>
    <div class="top-actions">
      <button class="tool-btn" type="button" id="themeToggle" aria-label="切换到浅色模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <span id="themeLabel">浅色模式</span>
      </button>
      <button class="tool-btn" type="button" id="fullscreenToggle" aria-pressed="false" aria-controls="fullscreenTip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        <span id="fullscreenLabel">全屏</span>
      </button>
    </div>
  </header>
<main class="dash">
  <div class="date-column">
  <section class="clock" aria-label="当前时间">
    <div class="time" aria-hidden="false"><span id="hm">--:--</span><span class="sec" id="ss">--</span></div>
    <div class="dateline"><span class="big" id="dayBig"></span><span class="wd" id="wday"></span></div>
    <div class="weekline" id="wk"></div>
    <div class="zone" id="zone"><span id="zLabel">东京</span><span class="zt" id="zTime">--:--</span><span id="zDiff"></span></div>
  </section>

  <section class="panel cal" aria-label="月历">
    <div class="phead">
      <span class="ctitle" id="calTitle"></span>
      <div class="calnav">
        <button type="button" id="calPrev" aria-label="上个月"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="calToday">今天</button>
        <button type="button" id="calNext" aria-label="下个月"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel milestones" aria-labelledby="milestoneHeading">
    <div class="phead">
      <h2 id="milestoneHeading">倒数日 · 正数日</h2>
      <button type="button" class="milestone-add" id="milestoneAdd" aria-label="添加倒数日或正数日">＋ 添加</button>
    </div>
    <div class="milestone-list" id="milestoneList"></div>
  </section>

  <div class="milestone-overlay" id="milestoneOverlay" hidden>
    <section class="milestone-dialog" role="dialog" aria-modal="true" aria-labelledby="milestoneDialogTitle" tabindex="-1">
      <div class="phead">
        <h2 id="milestoneDialogTitle">添加日期</h2>
        <button type="button" class="milestone-close" id="milestoneClose" aria-label="关闭日期设置">×</button>
      </div>
      <form id="milestoneForm" novalidate>
        <label class="milestone-field">计数方式
          <select id="milestoneType"><option value="countdown">倒数日 · 距离目标</option><option value="countup">正数日 · 从这天开始</option></select>
        </label>
        <label class="milestone-field">名称
          <input id="milestoneTitle" type="text" maxlength="40" placeholder="例如：旅行出发 / 坚持阅读" required autocomplete="off">
        </label>
        <label class="milestone-field"><span id="milestoneDateLabel">目标日期</span>
          <input id="milestoneDate" type="date" min="1900-01-01" max="9999-12-31" required>
        </label>
        <label class="milestone-include" id="milestoneIncludeWrap"><input id="milestoneInclude" type="checkbox"> 起始当天算第 1 天</label>
        <p class="milestone-error" id="milestoneError" role="alert"></p>
        <div class="milestone-actions">
          <button type="button" class="milestone-cancel" id="milestoneCancel">取消</button>
          <button type="submit" class="milestone-save">保存</button>
        </div>
      </form>
    </section>
  </div>

  </div>
  <div class="focus-column">
  <section class="panel pomo" id="pomo" data-mode="focus" aria-label="番茄钟">
    <div class="pomo-heading"><h2>番茄钟</h2><span>一次只专注一件事</span></div>
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="trk" cx="100" cy="100" r="88"/>
        <circle class="prg" id="prg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)" stroke-dasharray="552.92" stroke-dashoffset="0"/>
      </svg>
      <div class="rtxt"><span class="pm" id="pmode">专注</span><span class="pc" id="pclock">25:00</span></div>
    </div>
    <div class="pside">
      <div class="seg" role="group" aria-label="计时模式">
        <button type="button" data-mode="focus" aria-pressed="true">专注</button>
        <button type="button" data-mode="short" aria-pressed="false">短休</button>
        <button type="button" data-mode="long" aria-pressed="false">长休</button>
      </div>
      <div class="ptarget" id="ptarget"></div>
      <div class="pnote" id="pnote" hidden></div>
      <div class="pctl">
        <button type="button" class="go" id="pGo">开始</button>
        <button type="button" class="ghost" id="pReset">重置</button>
        <button type="button" class="ghost" id="pSkip">跳过</button>
      </div>
      <div class="pmeta">
        <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <span id="pCount">今日 0 轮</span>
        <span class="len">
          <button type="button" id="lenDown" aria-label="减少时长"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <span id="lenText">25 分钟</span>
          <button type="button" id="lenUp" aria-label="增加时长"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </span>
        <label class="tog" id="wakeWrap"><input type="checkbox" id="cWake"> 屏幕常亮</label>
        <label class="tog"><input type="checkbox" id="cSound"> 提示音</label>
      </div>
    </div>
  </section>

  <section class="panel tasks" aria-label="今日任务">
    <div class="phead">
      <div class="headr"><h2>今日任务</h2><span class="count" id="taskCount">0 / 0</span></div>
      <span class="sync" id="sync"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <form class="addrow" id="addForm" autocomplete="off">
      <input id="taskInput" type="text" maxlength="80" placeholder="写下一件事，按回车添加" aria-label="新任务">
      <button type="submit" class="btn-solid">添加</button>
    </form>
    <ul id="taskList"></ul>
    <div class="tfoot">
      <span>点任务名，设为当前专注</span>
      <button type="button" id="clearDone">清除已完成</button>
    </div>
  </section>
  </div>
</main>

</div>
<aside class="screen-tip" id="fullscreenTip" role="status" hidden>
  <strong>Safari 全屏显示</strong>
  <p id="fullscreenHelp"></p>
  <button type="button" id="dismissFullscreenTip">知道了</button>
</aside>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var MODE_NAME = { focus: '专注', short: '短休', long: '长休' };
  var STEP = { focus: 5, short: 1, long: 5 };
  var MIN = { focus: 5, short: 1, long: 5 };
  var MAX = { focus: 90, short: 30, long: 45 };
  var C = 552.92;
  var LS_STATE = 'dash:state:v1', LS_TIMER = 'dash:timer:v1', LS_CFG = 'dash:cfg:v1';

  function lsGet(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  var last = {};
  function setText(id, v) { if (last[id] !== v) { last[id] = v; $(id).textContent = v; } }

  /* ---------- appearance + Safari fullscreen ---------- */
  var themeChoice = lsGet('dash:theme:v1');
  if (themeChoice !== 'light' && themeChoice !== 'dark') themeChoice = null;
  var systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  function applyTheme() {
    var light = themeChoice ? themeChoice === 'light' : !!(systemTheme && systemTheme.matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    $('themeLabel').textContent = light ? '深色模式' : '浅色模式';
    $('themeToggle').setAttribute('aria-label', light ? '切换到深色模式' : '切换到浅色模式');
    $('themeToggle').title = light ? '切换到深色模式' : '切换到浅色模式';
    $('themeColor').setAttribute('content', light ? '#e8ecf1' : '#11151c');
  }
  $('themeToggle').addEventListener('click', function () {
    themeChoice = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    lsSet('dash:theme:v1', themeChoice);
    applyTheme();
  });
  if (systemTheme) {
    if (systemTheme.addEventListener) systemTheme.addEventListener('change', applyTheme);
    else if (systemTheme.addListener) systemTheme.addListener(applyTheme);
  }
  applyTheme();

  function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function standalone() {
    return navigator.standalone === true || !!(window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches));
  }
  function syncFullscreen() {
    var active = !!fullscreenElement(), installed = standalone();
    $('fullscreenLabel').textContent = active ? '退出全屏' : (installed ? '独立显示' : '全屏');
    $('fullscreenToggle').setAttribute('aria-pressed', active ? 'true' : 'false');
    $('fullscreenToggle').title = active ? '退出全屏（也可按 Esc）' : '进入全屏显示';
    if (active) $('fullscreenTip').hidden = true;
  }
  function showFullscreenHelp() {
    var appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    $('fullscreenHelp').textContent = appleTouch
      ? '此版本的 Safari 未能进入网页全屏。请在 Safari 的分享菜单中选择“添加到主屏幕”，再从桌面图标打开，即可隐藏 Safari 工具栏。若出现“作为网页 App 打开”，请保持开启。'
      : '未能进入网页全屏，请再点一次“全屏”。Mac 也可使用 Safari 的“显示 → 进入全屏幕”，或按 Control + Command + F。';
    $('fullscreenTip').hidden = false;
  }
  $('fullscreenToggle').addEventListener('click', function () {
    var active = fullscreenElement();
    var root = document.documentElement;
    var action = active ? (document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen)
      : (root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen);
    if (!action) { showFullscreenHelp(); return; }
    try {
      // Keep the request inside the click handler: Safari requires user activation.
      var result = action.call(active ? document : root);
      if (result && result.then) result.then(syncFullscreen, showFullscreenHelp);
    } catch (e) { showFullscreenHelp(); }
  });
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);
  document.addEventListener('fullscreenerror', showFullscreenHelp);
  document.addEventListener('webkitfullscreenerror', showFullscreenHelp);
  $('dismissFullscreenTip').addEventListener('click', function () { $('fullscreenTip').hidden = true; $('fullscreenToggle').focus(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') $('fullscreenTip').hidden = true; });
  syncFullscreen();


  /* ---------- state (tasks, today's rounds): local + optional private sync ---------- */
  function seedState() {
    return {
      v: 1, updated: 0, day: dayStr(), focusId: null, sessions: 0,
      tasks: [
        { id: uid(), text: '护理术语复习 20 个', done: false, pomos: 0 },
        { id: uid(), text: '日语跟读 15 分钟', done: false, pomos: 0 },
        { id: uid(), text: '回复未读消息', done: false, pomos: 0 }
      ]
    };
  }
  function normalize(r) {
    var t = [];
    (r.tasks || []).forEach(function (x) {
      if (x && typeof x.text === 'string') t.push({ id: String(x.id || uid()), text: x.text.slice(0, 80), done: !!x.done, pomos: +x.pomos || 0 });
    });
    return { v: 1, updated: +r.updated || 0, day: typeof r.day === 'string' ? r.day : dayStr(), focusId: r.focusId || null, sessions: +r.sessions || 0, tasks: t };
  }
  var st = (function () { var l = lsGet(LS_STATE); return l && Array.isArray(l.tasks) ? normalize(l) : seedState(); })();
  var cfg = (function () {
    var c = lsGet(LS_CFG) || {};
    var lens = c.lens || {};
    return {
      wake: c.wake !== false, sound: c.sound !== false,
      lens: { focus: lens.focus || 25, short: lens.short || 5, long: lens.long || 15 }
    };
  })();
  function saveCfg() { lsSet(LS_CFG, cfg); }

  var ref = null, pushTimer = 0, pushing = false, pushAgain = false;
  function setSync(t) { $('sync').textContent = t; }
  function queueRemote() { if (!ref) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 500); }
  function push() {
    if (!ref) return;
    if (pushing) { pushAgain = true; return; }
    pushing = true;
    ref.set(JSON.parse(JSON.stringify(st))).then(function () { setSync('已同步'); }, function () { setSync('仅保存在本机'); }).then(function () {
      pushing = false;
      if (pushAgain) { pushAgain = false; queueRemote(); }
    });
  }
  function onRemote(snap) {
    if (!snap.exists) { setSync('已同步'); if (st.updated > 0) queueRemote(); return; }
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    var r = snap.data();
    if (!r || !Array.isArray(r.tasks)) return;
    var ru = +r.updated || 0;
    if (ru > st.updated) { st = normalize(r); lsSet(LS_STATE, st); checkDay(true); renderTasks(); renderPomo(); }
    else if (st.updated > ru) queueRemote();
    setSync('已同步');
  }
  function initSync() {
    try {
      if (!window.claude || !window.claude.use) { setSync('仅保存在本机'); return; }
      Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (a) {
        var user = a[0], dbns = a[1];
        if (!user || !dbns) { setSync('仅保存在本机'); return null; }
        return user.id().then(function (id) {
          if (!id) { setSync('仅保存在本机'); return; }
          ref = dbns.doc('data/users/' + id + '/dash');
          ref.onSnapshot(onRemote, function () { ref = null; setSync('仅保存在本机'); });
        });
      }).catch(function () { ref = null; setSync('仅保存在本机'); });
    } catch (e) { setSync('仅保存在本机'); }
  }
  function touch() {
    st.updated = Date.now();
    lsSet(LS_STATE, st);
    queueRemote();
    renderTasks();
    renderPomo();
  }
  function checkDay(quiet) {
    var today = dayStr();
    if (st.day === today) return;
    st.day = today;
    st.tasks = st.tasks.filter(function (t) { return !t.done; });
    st.sessions = 0;
    if (st.focusId && !findTask(st.focusId)) st.focusId = null;
    if (quiet) { lsSet(LS_STATE, st); return; }
    touch();
  }
  function findTask(id) { for (var i = 0; i < st.tasks.length; i++) if (st.tasks[i].id === id) return st.tasks[i]; return null; }

  /* ---------- clock ---------- */
  function tzOffset(tz, d) {
    var p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(d);
    var o = {};
    p.forEach(function (x) { o[x.type] = x.value; });
    return (Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute, +o.second) - Math.floor(d.getTime() / 1000) * 1000) / 60000;
  }
  var zoneKey = '';
  function renderZone(now, key) {
    if (zoneKey === key) return;
    zoneKey = key;
    try {
      var local = -now.getTimezoneOffset();
      var tz = 'Asia/Tokyo', label = '东京';
      if (tzOffset(tz, now) === local) { tz = 'Asia/Shanghai'; label = '上海'; }
      var diff = (tzOffset(tz, now) - local) / 60;
      var f = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      setText('zLabel', label);
      setText('zTime', f.format(now));
      setText('zDiff', diff === 0 ? '' : (diff > 0 ? '+' : '') + diff + ' 小时');
    } catch (e) { $('zone').hidden = true; }
  }
  function renderClock(now) {
    var hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
    setText('hm', hm);
    setText('ss', pad(now.getSeconds()));
    setText('dayBig', (now.getMonth() + 1) + '月' + now.getDate() + '日');
    setText('wday', '星期' + WD[now.getDay()]);
    setText('wk', now.getFullYear() + ' · 第 ' + isoWeek(now) + ' 周');
    renderZone(now, hm);
  }

  /* ---------- calendar ---------- */
  var view = { y: new Date().getFullYear(), m: new Date().getMonth() };
  function renderCal() {
    var y = view.y, m = view.m, today = dayStr();
    $('calTitle').textContent = y + '年' + (m + 1) + '月';
    var off = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((off + dim) / 7);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < rows * 7; i++) {
      var d = new Date(y, m, 1 - off + i);
      var el = document.createElement('div');
      var cls = 'd';
      if (d.getMonth() !== m) cls += ' out';
      var w = d.getDay();
      if (w === 0 || w === 6) cls += ' we';
      if (dayStr(d) === today) cls += ' today';
      el.className = cls;
      el.textContent = d.getDate();
      frag.appendChild(el);
    }
    var box = $('days');
    box.textContent = '';
    box.appendChild(frag);
    box.style.setProperty('--rows', rows);
  }

  /* Civil calendar days avoid daylight-saving and UTC-date shifts. */
  var LS_MILESTONES = 'dash:milestones:v1';
  function milestoneDay(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    var bits = value.split('-').map(Number), y = bits[0], m = bits[1], d = bits[2];
    if (y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1 || d > 31) return null;
    var stamp = Date.UTC(y, m - 1, d), date = new Date(stamp);
    return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d ? stamp / 86400000 : null;
  }
  var milestoneSaved = lsGet(LS_MILESTONES);
  var milestoneItems = (Array.isArray(milestoneSaved) ? milestoneSaved : []).filter(function (item) {
    return item && typeof item.id === 'string' && typeof item.title === 'string' && item.title.trim() &&
      typeof item.date === 'string' && milestoneDay(item.date) !== null && (item.type === 'countdown' || item.type === 'countup');
  }).map(function (item) {
    return { id: item.id, title: item.title.trim().slice(0, 40), date: item.date, type: item.type, includeStart: !!item.includeStart };
  });
  var milestoneEditing = null, milestoneReturnFocus = null;
  function milestoneNode(tag, className, value) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  }
  function renderMilestones() {
    var list = $('milestoneList');
    list.textContent = '';
    if (!milestoneItems.length) {
      [{ type: 'countdown', title: '添加一个倒数日', hint: '期待下一次出发、生日或重要时刻' },
        { type: 'countup', title: '记录一个正数日', hint: '记录习惯、陪伴与每一份坚持' }].forEach(function (sample) {
        var button = milestoneNode('button', 'milestone-empty'); button.type = 'button';
        var copy = milestoneNode('span');
        copy.appendChild(milestoneNode('strong', '', sample.title));
        copy.appendChild(milestoneNode('small', '', sample.hint));
        button.appendChild(copy); button.appendChild(milestoneNode('b', '', '＋'));
        button.addEventListener('click', function () { openMilestone(null, sample.type); });
        list.appendChild(button);
      });
      return;
    }
    var today = milestoneDay(dayStr());
    milestoneItems.forEach(function (item) {
      var difference = milestoneDay(item.date) - today;
      var card = milestoneNode('div', 'milestone-card'); card.setAttribute('data-type', item.type);
      var edit = milestoneNode('button', 'milestone-edit'); edit.type = 'button'; edit.setAttribute('aria-label', '编辑' + item.title);
      var info = milestoneNode('span', 'milestone-info');
      info.appendChild(milestoneNode('span', 'milestone-name', item.title));
      info.appendChild(milestoneNode('span', 'milestone-date', item.date.replace(/-/g, '.') + ' · ' +
        (item.type === 'countdown' ? '倒数日' : '正数日' + (item.includeStart ? ' · 含起始日' : ''))));
      var value = milestoneNode('span', 'milestone-value');
      var amount, caption;
      if (item.type === 'countdown') {
        if (difference === 0) value.appendChild(milestoneNode('span', 'milestone-status', '就是今天'));
        else { amount = Math.abs(difference); caption = difference > 0 ? '天后' : '天前'; }
      } else if (difference > 0) {
        value.appendChild(milestoneNode('span', 'milestone-unit', '还有'));
        amount = difference; caption = '天开始';
      } else {
        amount = -difference + (item.includeStart ? 1 : 0); caption = '天';
      }
      if (amount !== undefined) {
        if (item.type === 'countdown' && difference < 0) {
          value.appendChild(milestoneNode('span', 'milestone-unit', '已过'));
          caption = '天';
        } else if (item.type === 'countup' && difference <= 0) value.appendChild(milestoneNode('span', 'milestone-unit', '已坚持'));
        value.appendChild(milestoneNode('span', 'milestone-number', String(amount)));
        value.appendChild(milestoneNode('span', 'milestone-unit', caption));
      }
      edit.setAttribute('aria-label', '编辑' + item.title + '，' + item.date + '，' + value.textContent);
      edit.appendChild(info); edit.appendChild(value);
      edit.addEventListener('click', function () { openMilestone(item); });
      var remove = milestoneNode('button', 'milestone-delete', '×'); remove.type = 'button'; remove.setAttribute('aria-label', '删除' + item.title);
      remove.addEventListener('click', function () {
        milestoneItems = milestoneItems.filter(function (other) { return other.id !== item.id; });
        lsSet(LS_MILESTONES, milestoneItems); renderMilestones();
        $('milestoneAdd').focus();
      });
      card.appendChild(edit); card.appendChild(remove); list.appendChild(card);
    });
  }
  function milestoneMode() {
    var countup = $('milestoneType').value === 'countup';
    $('milestoneDateLabel').textContent = countup ? '起始日期' : '目标日期';
    $('milestoneIncludeWrap').hidden = !countup;
  }
  function openMilestone(item, initialType) {
    milestoneEditing = item ? item.id : null;
    milestoneReturnFocus = document.activeElement;
    $('milestoneDialogTitle').textContent = item ? '编辑日期' : '添加日期';
    $('milestoneType').value = item ? item.type : (initialType || 'countdown');
    $('milestoneTitle').value = item ? item.title : '';
    var defaultDate = new Date();
    if ($('milestoneType').value === 'countdown') defaultDate.setDate(defaultDate.getDate() + 30);
    $('milestoneDate').value = item ? item.date : dayStr(defaultDate);
    $('milestoneInclude').checked = item ? item.includeStart : false;
    $('milestoneError').textContent = '';
    milestoneMode(); $('milestoneOverlay').hidden = false;
    document.body.classList.add('milestone-modal-open');
    $('milestoneTitle').focus();
  }
  function closeMilestone() {
    $('milestoneOverlay').hidden = true;
    document.body.classList.remove('milestone-modal-open');
    var returnNode = milestoneReturnFocus && document.documentElement.contains(milestoneReturnFocus) ? milestoneReturnFocus : $('milestoneAdd');
    returnNode.focus();
  }
  $('milestoneAdd').addEventListener('click', function () { openMilestone(); });
  $('milestoneType').addEventListener('change', milestoneMode);
  $('milestoneCancel').addEventListener('click', closeMilestone);
  $('milestoneClose').addEventListener('click', closeMilestone);
  $('milestoneOverlay').addEventListener('click', function (event) { if (event.target === this) closeMilestone(); });
  $('milestoneForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var title = $('milestoneTitle').value.trim(), date = $('milestoneDate').value;
    if (!title) { $('milestoneError').textContent = '请填写一个名称。'; $('milestoneTitle').focus(); return; }
    if (milestoneDay(date) === null) { $('milestoneError').textContent = '请选择有效日期（1900—9999 年）。'; $('milestoneDate').focus(); return; }
    var item = { id: milestoneEditing || uid(), type: $('milestoneType').value, title: title.slice(0, 40), date: date, includeStart: $('milestoneInclude').checked };
    var index = milestoneItems.findIndex(function (other) { return other.id === milestoneEditing; });
    if (index === -1) milestoneItems.push(item); else milestoneItems[index] = item;
    lsSet(LS_MILESTONES, milestoneItems); renderMilestones(); closeMilestone();
  });
  document.addEventListener('keydown', function (event) {
    if ($('milestoneOverlay').hidden) return;
    if (event.key === 'Escape') { event.preventDefault(); closeMilestone(); }
    if (event.key === 'Tab') {
      var focusable = Array.prototype.filter.call($('milestoneOverlay').querySelectorAll('button, input, select, [tabindex="0"]'), function (node) {
        return !node.disabled && node.getClientRects().length > 0;
      });
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  renderMilestones();


  /* ---------- tasks ---------- */
  function renderTasks() {
    var list = $('taskList');
    list.textContent = '';
    var tasks = st.tasks.slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
    if (!tasks.length) {
      var e = document.createElement('li');
      e.className = 'empty';
      e.textContent = '今天还没有任务，在上面写下第一件事。';
      list.appendChild(e);
    }
    tasks.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === st.focusId ? ' focus' : '');
      li.setAttribute('data-id', t.id);

      var chk = document.createElement('button');
      chk.type = 'button'; chk.className = 'chk'; chk.setAttribute('data-act', 'done');
      chk.setAttribute('aria-label', t.done ? '标为未完成' : '标为完成');
      chk.setAttribute('aria-pressed', t.done ? 'true' : 'false');
      chk.innerHTML = '<i><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';

      var tx = document.createElement('button');
      tx.type = 'button'; tx.className = 'ttext'; tx.setAttribute('data-act', 'focus');
      tx.title = '设为当前专注'; tx.disabled = t.done;
      var dot = document.createElement('span'); dot.className = 'fdot';
      var tl = document.createElement('span'); tl.className = 'tl'; tl.textContent = t.text;
      tx.appendChild(dot); tx.appendChild(tl);

      var tp = document.createElement('span');
      tp.className = 'tp';
      if (t.pomos) { tp.textContent = '×' + t.pomos; tp.title = '已完成 ' + t.pomos + ' 轮专注'; }

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.setAttribute('data-act', 'del'); del.setAttribute('aria-label', '删除任务');
      del.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

      li.appendChild(chk); li.appendChild(tx); li.appendChild(tp); li.appendChild(del);
      list.appendChild(li);
    });
    var done = st.tasks.filter(function (t) { return t.done; }).length, n = st.tasks.length;
    setText('taskCount', done + ' / ' + n);
    $('bar').style.width = (n ? done / n * 100 : 0) + '%';
    $('clearDone').disabled = !done;
  }
  $('taskList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var li = b.closest('li'), id = li && li.getAttribute('data-id'), t = id && findTask(id);
    if (!t) return;
    var act = b.getAttribute('data-act');
    if (act === 'done') { t.done = !t.done; if (t.done && st.focusId === id) st.focusId = null; }
    else if (act === 'focus') { st.focusId = st.focusId === id ? null : id; }
    else if (act === 'del') { st.tasks = st.tasks.filter(function (x) { return x.id !== id; }); if (st.focusId === id) st.focusId = null; }
    touch();
  });
  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inp = $('taskInput'), v = inp.value.trim().slice(0, 80);
    if (!v) return;
    st.tasks.push({ id: uid(), text: v, done: false, pomos: 0 });
    inp.value = '';
    touch();
    inp.focus();
  });
  $('clearDone').addEventListener('click', function () {
    st.tasks = st.tasks.filter(function (t) { return !t.done; });
    touch();
  });

  /* ---------- pomodoro ---------- */
  var timer = (function () {
    var t = lsGet(LS_TIMER);
    var m = t && MODE_NAME[t.mode] ? t.mode : 'focus';
    var tot = cfg.lens[m] * 60000;
    var o = { mode: m, running: false, endAt: 0, left: tot };
    if (t && t.running && t.endAt > Date.now()) { o.running = true; o.endAt = t.endAt; o.left = t.endAt - Date.now(); }
    else if (t && !t.running && t.left > 0 && t.left <= tot) { o.left = t.left; }
    return o;
  })();
  var pnote = '', flashT = 0;
  function total() { return cfg.lens[timer.mode] * 60000; }
  function saveTimer() { lsSet(LS_TIMER, { mode: timer.mode, running: timer.running, endAt: timer.endAt, left: timer.left }); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function renderRing() {
    setText('pclock', fmt(timer.left));
    $('prg').setAttribute('stroke-dashoffset', (C * (1 - Math.max(0, Math.min(1, timer.left / total())))).toFixed(2));
  }
  function renderPomo() {
    var p = $('pomo');
    p.setAttribute('data-mode', timer.mode);
    setText('pmode', MODE_NAME[timer.mode]);
    Array.prototype.forEach.call(p.querySelectorAll('.seg button'), function (b) {
      var on = b.getAttribute('data-mode') === timer.mode;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.disabled = timer.running;
    });
    var full = timer.left >= total() - 500;
    setText('pGo', timer.running ? '暂停' : (full ? '开始' : '继续'));
    var ft = findTask(st.focusId);
    var tg = $('ptarget');
    tg.textContent = '';
    if (ft) { tg.appendChild(document.createTextNode('当前专注：')); var b = document.createElement('b'); b.textContent = ft.text; tg.appendChild(b); }
    else tg.textContent = '未选择任务，可在任务列表里点一项';
    var pn = $('pnote');
    pn.hidden = !pnote; pn.textContent = pnote;
    var n = st.sessions % 4, filled = (n === 0 && st.sessions > 0 && timer.mode === 'long') ? 4 : n;
    Array.prototype.forEach.call($('dots').children, function (d, i) { d.className = i < filled ? 'on' : ''; });
    setText('pCount', '今日 ' + st.sessions + ' 轮');
    setText('lenText', cfg.lens[timer.mode] + ' 分钟');
    $('lenDown').disabled = timer.running || cfg.lens[timer.mode] <= MIN[timer.mode];
    $('lenUp').disabled = timer.running || cfg.lens[timer.mode] >= MAX[timer.mode];
    renderRing();
  }
  var actx = null;
  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep() {
    ensureAudio();
    if (!actx) return;
    try {
      var t0 = actx.currentTime;
      [0, 0.24, 0.48].forEach(function (o, i) {
        var osc = actx.createOscillator(), g = actx.createGain();
        osc.type = 'sine'; osc.frequency.value = i === 2 ? 988 : 784;
        g.gain.setValueAtTime(0.0001, t0 + o);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + o + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + 0.22);
        osc.connect(g); g.connect(actx.destination);
        osc.start(t0 + o); osc.stop(t0 + o + 0.24);
      });
    } catch (e) {}
  }
  function flash() {
    var p = $('pomo');
    p.classList.remove('flash');
    void p.offsetWidth;
    p.classList.add('flash');
    clearTimeout(flashT);
    flashT = setTimeout(function () { p.classList.remove('flash'); }, 6000);
  }
  function setMode(m) { timer.mode = m; timer.running = false; timer.left = total(); pnote = ''; saveTimer(); renderPomo(); }
  function start() {
    ensureAudio();
    if (timer.left <= 0) timer.left = total();
    timer.endAt = Date.now() + timer.left;
    timer.running = true; pnote = '';
    saveTimer(); renderPomo();
    if (cfg.wake) setWake(true);
  }
  function pause() { timer.left = Math.max(0, timer.endAt - Date.now()); timer.running = false; saveTimer(); renderPomo(); }
  function complete() {
    timer.running = false;
    var next;
    if (timer.mode === 'focus') {
      st.sessions += 1;
      var t = findTask(st.focusId);
      if (t) t.pomos = (t.pomos || 0) + 1;
      next = st.sessions % 4 === 0 ? 'long' : 'short';
      pnote = '专注完成，休息 ' + cfg.lens[next] + ' 分钟';
      touch();
    } else {
      next = 'focus';
      pnote = '休息结束，开始下一轮专注';
    }
    timer.mode = next; timer.left = total();
    saveTimer();
    if (cfg.sound) beep();
    flash();
    renderPomo();
  }
  $('pGo').addEventListener('click', function () { if (timer.running) pause(); else start(); });
  $('pReset').addEventListener('click', function () { timer.running = false; timer.left = total(); pnote = ''; saveTimer(); renderPomo(); });
  $('pSkip').addEventListener('click', function () { setMode(timer.mode === 'focus' ? 'short' : 'focus'); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { if (!timer.running) setMode(b.getAttribute('data-mode')); });
  });
  function stepLen(dir) {
    var m = timer.mode;
    cfg.lens[m] = Math.max(MIN[m], Math.min(MAX[m], cfg.lens[m] + dir * STEP[m]));
    saveCfg();
    timer.left = total();
    saveTimer(); renderPomo();
  }
  $('lenDown').addEventListener('click', function () { stepLen(-1); });
  $('lenUp').addEventListener('click', function () { stepLen(1); });

  /* ---------- screen wake lock + toggles ---------- */
  var wl = null;
  function setWake(on) {
    try {
      if (!navigator.wakeLock) return;
      if (on) {
        if (wl) return;
        navigator.wakeLock.request('screen').then(function (l) {
          wl = l;
          l.addEventListener('release', function () { wl = null; });
        }, function () { wl = null; });
      } else if (wl) { wl.release(); wl = null; }
    } catch (e) { wl = null; }
  }
  if (!navigator.wakeLock) $('wakeWrap').hidden = true;
  $('cWake').checked = cfg.wake;
  $('cSound').checked = cfg.sound;
  $('cWake').addEventListener('change', function () { cfg.wake = this.checked; saveCfg(); setWake(cfg.wake); });
  $('cSound').addEventListener('change', function () { cfg.sound = this.checked; saveCfg(); if (cfg.sound) { ensureAudio(); beep(); } });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (cfg.wake) setWake(true); tick(); }
  });
  document.addEventListener('pointerdown', function () { if (cfg.wake && !wl) setWake(true); }, { once: true });

  /* ---------- calendar nav ---------- */
  $('calPrev').addEventListener('click', function () { view.m -= 1; if (view.m < 0) { view.m = 11; view.y -= 1; } renderCal(); });
  $('calNext').addEventListener('click', function () { view.m += 1; if (view.m > 11) { view.m = 0; view.y += 1; } renderCal(); });
  $('calToday').addEventListener('click', function () { var n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); renderCal(); });

  /* ---------- loop ---------- */
  var lastDay = dayStr();
  function tick() {
    var now = new Date();
    renderClock(now);
    var ds = dayStr(now);
    if (ds !== lastDay) {
      lastDay = ds;
      checkDay();
      renderCal();
      renderMilestones();
    }
    if (timer.running) {
      var left = timer.endAt - Date.now();
      if (left <= 0) { timer.left = 0; complete(); }
      else { timer.left = left; renderRing(); }
    }
  }

  checkDay(true);
  renderClock(new Date());
  renderCal();
  renderTasks();
  renderPomo();
  renderMilestones();
  setInterval(tick, 250);
  initSync();
  if (cfg.wake) setWake(true);
})();
</script>
</body>
</html>
