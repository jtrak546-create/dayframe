/* 墨白 (graphite & white): flat graphite ground, big soft panels, one coral accent.
   Layout on a landscape iPad (1024x768):
     top bar:    brand, big clock, date, theme + fullscreen
     middle row: pomodoro (largest) | today's tasks
     bottom row: month calendar | countdown / count-up days (both flat, no panel)
   Below 900px wide it becomes one column. */
:root {
  --bg: #202020;
  --panel: #2b2b2b;
  --panel-2: #343434;
  --line: #424242;
  --fg: #ededeb;
  --fg-2: #bdbdb8;
  --fg-3: #a9a9a4;
  --focus: #ff8063;
  --focus-ink: #25130e;
  --rest: #b8c2ac;
  --rest-ink: #20251b;
  --act: #ff6945;
  --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 20px 70px rgba(0, 0, 0, .35);
  --f-num: "Frame Numerals", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body: "Frame Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ececed;
  --panel: #fafafa;
  --panel-2: #f0f0f0;
  --line: #dcdcd9;
  --fg: #30302f;
  --fg-2: #54544f;
  --fg-3: #666663;
  --focus: #bd4428;
  --focus-ink: #ffffff;
  --rest: #55664a;
  --rest-ink: #ffffff;
  --act: #ff6945;
  --scrim: rgba(32, 32, 32, .4);
  --shadow: 0 20px 70px rgba(0, 0, 0, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #ececed; --panel: #fafafa; --panel-2: #f0f0f0; --line: #dcdcd9;
    --fg: #30302f; --fg-2: #54544f; --fg-3: #666663;
    --focus: #bd4428; --focus-ink: #ffffff; --rest: #55664a; --rest-ink: #ffffff; --act: #ff6945;
    --scrim: rgba(32, 32, 32, .4); --shadow: 0 20px 70px rgba(0, 0, 0, .18); color-scheme: light;
  }
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.45 var(--f-body);
  font-synthesis: none;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
input, select { -webkit-user-select: text; user-select: text; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
ul { list-style: none; padding: 0; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  min-height: 640px;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) clamp(196px, 31vh, 240px);
  grid-template-areas: "top top" "pomo tasks" "cal miles";
  gap: 18px 24px;
}
.hint { font-size: 14px; color: var(--fg-3); }
.panel { background: var(--panel); border-radius: 27px; min-width: 0; min-height: 0; }

/* ---------- top bar: brand, clock, tools ---------- */
.topbar { grid-area: top; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 28px; min-height: 78px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: .12em; color: var(--fg-2); flex: none; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--act); }
.clock { display: flex; align-items: center; gap: 22px; min-width: 0; }
.time {
  display: flex; align-items: baseline; gap: .12em;
  font-family: var(--f-num); font-variant-numeric: tabular-nums;
  font-size: clamp(52px, 9.4vh, 78px); line-height: 1; letter-spacing: -.035em;
}
.time .sec { font-size: .32em; letter-spacing: 0; color: var(--fg-3); }
.dinfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.dline { font-size: 18px; line-height: 1.3; white-space: nowrap; }
.dline span { color: var(--fg-2); margin-left: 8px; }
.dmeta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 14px; font-size: 14px; color: var(--fg-3); white-space: nowrap; }
.zone { display: inline-flex; align-items: baseline; gap: 6px; color: var(--fg-2); }
.zone .zt { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 16px; color: var(--fg); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tool { height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-2); white-space: nowrap; }
.tool:hover:not(:disabled) { background: var(--panel); color: var(--fg); }
.tool:disabled { opacity: .5; }
.tool svg { width: 18px; height: 18px; flex: none; }
.tool .i-moon { display: none; }
:root[data-theme="light"] .tool .i-sun { display: none; }
:root[data-theme="light"] .tool .i-moon { display: block; }

/* ---------- pomodoro ---------- */
.pomo {
  --pm: var(--act); --pm-text: var(--focus);
  grid-area: pomo; position: relative;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px;
  padding: 16px 26px 20px; box-shadow: 0 6px 24px #00000008;
}
.pomo[data-mode="short"], .pomo[data-mode="long"] { --pm: var(--rest); --pm-text: var(--rest); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.seg { display: flex; gap: 4px; }
.seg button { position: relative; min-width: 56px; height: 44px; padding: 0 10px; font-size: 16px; color: var(--fg-3); }
.seg button[aria-pressed="true"] { color: var(--fg); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--pm); }
.seg button:disabled:not([aria-pressed="true"]) { opacity: .5; }
.putil { display: flex; gap: 2px; }
.util-btn { height: 44px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--fg-2); white-space: nowrap; }
.util-btn:hover { background: var(--panel-2); color: var(--fg); }
.util-btn svg { width: 18px; height: 18px; flex: none; }
.pface { min-height: 0; container-type: size; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.pc {
  font-family: var(--f-num); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; white-space: nowrap;
  font-size: clamp(84px, 16vh, 150px);
  font-size: min(27cqw, 66cqh);
}
.line { width: 76%; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; flex: none; }
.line i { display: block; height: 100%; width: 100%; background: var(--pm); }
.ptarget { font-size: 16px; text-align: center; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 24px; }
.ptarget b { color: var(--fg); font-weight: 400; }
.pnote { font-size: 15px; text-align: center; color: var(--pm-text); }
.pctl { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: nowrap; }
.pctl .go {
  min-width: 132px; height: 54px; padding: 0 24px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  background: var(--fg); color: var(--bg); font-size: 18px; font-weight: 500;
}
.pctl .go::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--act); }
.pctl .ghost { height: 54px; min-width: 54px; padding: 0 14px; border-radius: 999px; color: var(--fg-2); font-size: 16px; }
.pctl .ghost:hover { background: var(--panel-2); color: var(--fg); }
.prounds { display: flex; align-items: center; gap: 9px; margin-left: 10px; font-size: 14px; color: var(--fg-2); white-space: nowrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--fg-3); }

}

/* ---------- tasks ---------- */

.thead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.headr { display: flex; align-items: baseline; gap: 12px; }
.thead h2 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }

.link-btn { height: 44px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: var(--fg-2); }

.fdot { width: 8px; height: 8px; border-radius: 50%; background: var(--act); flex: none; display: none; }

.task.done .tl { color: var(--fg-3); text-decoration: line-through; }
.ttext:disabled { color: var(--fg-3); }
.tp { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--fg-3); padding: 0 6px; }
.del { width: 44px; height: 52px; display: grid; place-items: center end; color: var(--fg-3); }

.field {

.btn { height: 48px; padding: 0 22px; border-radius: 999px; background: var(--panel-2); color: var(--fg); font-size: 16px; }
.btn.main { background: var(--fg); color: var(--bg); font-weight: 500; }
.btn.danger { background: transparent; color: var(--focus); }

/* ---------- calendar (flat) ---------- */
.cal { grid-area: cal; display: grid; grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 14px; padding: 2px 0 0 4px; min-height: 0; }

.cmonth b { display: block; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 400; font-size: 52px; line-height: 1; letter-spacing: -.04em; color: var(--fg-2); }
.cmonth small { display: block; margin-top: 4px; font-size: 14px; color: var(--fg-3); letter-spacing: .04em; }
.calnav { display: flex; align-items: center; margin-left: -10px; }
.calnav button { min-width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-2); font-size: 14px; border-radius: 10px; padding: 0 6px; }
.calnav button:hover { background: var(--panel); color: var(--fg); }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 14px; color: var(--fg-3); text-align: center; line-height: 24px; }
.days { min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 6), minmax(0, 1fr)); }
.d { position: relative; display: grid; place-items: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 17px; min-height: 0; }
.d span { display: grid; place-items: center; min-width: 28px; height: 28px; border-radius: 50%; }

.d.out { color: var(--fg-3); opacity: .6; }
.d.today span { background: var(--act); color: #25130e; }
.d.today { opacity: 1; }
.d.mark::after { content: ""; position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--act); }
.d.today.mark::after { display: none; }

/* ---------- countdown / count-up days (flat) ---------- */
.miles { grid-area: miles; display: flex; flex-direction: column; min-height: 0; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; flex: none; }
.mhead h2 { font-size: 15px; font-weight: 400; color: var(--fg-3); letter-spacing: .02em; }
.add-btn { height: 40px; padding: 0 12px; border-radius: 999px; font-size: 15px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.add-btn:hover { background: var(--panel); color: var(--fg); }
.mlist { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.row {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
  min-height: 48px; padding: 3px 6px 3px 0; text-align: left; border-bottom: 1px solid var(--line);
}
li:last-child > .row { border-bottom: 0; }
.row:hover { background: var(--panel); }
.rinfo { min-width: 0; display: flex; flex-direction: column; }
.rname { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.rsub { font-size: 14px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.rval { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; color: var(--fg); }
.rval .n { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1; letter-spacing: -.03em; }
.rval .u { font-size: 14px; color: var(--fg-3); }
.row[data-kind="soon"] .n { color: var(--focus); }
.row[data-kind="past"] .n { color: var(--fg-3); }
.row.today .n { font-family: var(--f-body); font-size: 22px; color: var(--focus); }
.empty { padding: 10px 0; color: var(--fg-3); font-size: 15px; line-height: 1.6; }

/* ---------- dialogs ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--scrim); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: min(460px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border-radius: 27px; box-shadow: var(--shadow); padding: 22px 26px 24px; outline: 0; }
.dialog h2 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; color: var(--fg); }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.xbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg-2); font-size: 26px; line-height: 1; }
.xbtn:hover { background: var(--panel-2); }
.fld { display: grid; gap: 8px; margin-top: 16px; font-size: 15px; color: var(--fg-2); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; color: var(--fg); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--act); flex: none; }
.err { min-height: 22px; margin-top: 10px; font-size: 15px; color: var(--focus); }
.dactions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.dactions .spacer { flex: 1; }
.lens { display: grid; gap: 0; margin-top: 6px; }
.lenrow { display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid var(--line); font-size: 17px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; color: var(--fg); }
.stepper button:disabled { opacity: .35; }
.stepper span { min-width: 80px; text-align: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 20px; }
.stepper span em { font-style: normal; font-family: var(--f-body); font-size: 14px; color: var(--fg-3); margin-left: 3px; }
.note { font-size: 14px; color: var(--fg-3); line-height: 1.55; margin: 2px 0 6px 32px; }
.sum { display: flex; gap: 28px; align-items: baseline; margin: 6px 0 14px; }
.sum b { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 400; font-size: 52px; line-height: 1; letter-spacing: -.04em; }
.sum span { font-size: 14px; color: var(--fg-3); margin-left: 6px; }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 150px; align-items: end; }
.sday { height: 100%; display: grid; grid-template-rows: 20px minmax(0, 1fr) 22px; gap: 4px; text-align: center; font-size: 14px; color: var(--fg-3); }
.sday .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--fg-2); }
.sday .tr { display: flex; align-items: flex-end; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.sday .tr i { display: block; width: 100%; background: var(--fg-3); border-radius: 8px 8px 0 0; min-height: 0; }
.sday.t .tr i { background: var(--act); }
.sday.t { color: var(--fg); }
.sfoot { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--fg-3); }
.tip { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); background: var(--panel); box-shadow: var(--shadow); border-radius: 22px; padding: 16px 22px; display: grid; gap: 6px; }
.tip strong { font-weight: 500; font-size: 16px; }
.tip p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }
.tip button { justify-self: end; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--panel-2); font-size: 15px; }

/* narrower than a landscape iPad: one column, reading order */
@media (max-width: 899px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "top" "pomo" "tasks" "miles" "cal"; gap: 22px; }
  .time { font-size: clamp(64px, 14vw, 96px); }
  .pomo { grid-template-rows: auto auto auto auto; }
  .pface { container-type: normal; padding: 10px 0; }
  .pc { font-size: clamp(100px, 24vw, 170px); }
  .tasks { min-height: 0; }
  .cal { grid-template-rows: auto auto; }

}

<div class="app">
  <header class="topbar">
    <div class="brand"><i aria-hidden="true"></i>DAYFRAME</div>
    <div class="clock" aria-label="当前时间">
      <div class="time"><span id="hm">--:--</span><span class="sec" id="ss">--</span></div>
      <div class="dinfo">
        <div class="dline"><b id="dayBig" style="font-weight:500"></b><span id="wday"></span></div>
        <div class="dmeta"><span id="wk"></span><span class="zone" id="zone"><span id="zLabel">东京</span><span class="zt" id="zTime">--:--</span><span id="zDiff"></span></span></div>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="tool" id="themeToggle" aria-label="切换日间模式" title="切换日间 / 夜间模式">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>
        <span id="themeLabel">日间模式</span>
      </button>
      <button type="button" class="tool" id="fullscreenToggle" aria-pressed="false" aria-label="全屏" title="全屏显示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="fsIcon"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
        <span id="fsLabel">全屏</span>
      </button>
    </div>
  </header>

  <section class="panel pomo" id="pomo" data-mode="focus" aria-label="番茄钟">
    <div class="phead">
      <div class="seg" role="group" aria-label="计时模式">
        <button type="button" data-mode="focus" aria-pressed="true">专注</button>
        <button type="button" data-mode="short" aria-pressed="false">短休</button>
        <button type="button" data-mode="long" aria-pressed="false">长休</button>
      </div>
      <div class="putil">
        <button type="button" class="util-btn" id="statsOpen" aria-haspopup="dialog"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 16V9m6 7V4m6 12v-6"/></svg>统计</button>
        <button type="button" class="util-btn" id="setOpen" aria-haspopup="dialog"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 6h4m4 0h6M3 14h8m4 0h2"/><circle cx="9" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg>设置</button>
      </div>
    </div>
    <div class="pface">
      <div class="pc" id="pclock" role="timer" aria-label="25 分 00 秒">25:00</div>
      <div class="line" aria-hidden="true"><i id="pLine"></i></div>
    </div>
    <div>

      <p class="pnote" id="pnote" aria-live="polite" hidden></p>

      <button type="button" class="go" id="pGo">开始</button>

  </section>

    </div>
    <div class="dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>

    } else {
      var n = -diff + (it.includeStart ? 1 : 0), step = n < 1000 ? 100 : 500, rem = n % step;
      v.kind = 'up'; v.num = String(n); v.unit = '天'; v.order = 1;
      if (n === 0) { v.sub = '从今天开始'; v.key = 0; }
      else if (rem === 0) { v.sub = '今天是整数日 · 第 ' + n + ' 天'; v.key = -1; }
      else { v.sub = '整数日 第 ' + (n + step - rem) + ' 天 · 还差 ' + (step - rem) + ' 天'; v.key = step - rem; }
    }
    return v;
  }
  function renderMilestones() {
    var list = $('mList');
    list.textContent = '';
    if (!ms.length) {
      var li0 = el('li', 'empty', '点右上角「添加」，记下要等待的日子（倒数日），或要累计的日子（正数日）。');
      list.appendChild(li0);
      setText('mMore', '');
      return;
    }
    var today = civilDay(dayStr());
    var views = ms.map(function (it) { return msView(it, today); }).sort(function (a, b) { return a.order - b.order || a.key - b.key; });
    views.forEach(function (v) {
      var li = document.createElement('li');
      var row = el('button', 'row' + (v.num === '今天' ? ' today' : '')); row.type = 'button'; row.setAttribute('data-kind', v.kind);
      var info = el('span', 'rinfo'); info.appendChild(el('span', 'rname', v.it.title)); info.appendChild(el('span', 'rsub', v.sub));
      var val = el('span', 'rval'); val.appendChild(el('span', 'n', v.num)); if (v.unit) val.appendChild(el('span', 'u', v.unit));
      row.setAttribute('aria-label', '编辑 ' + v.it.title + '，' + v.num + (v.unit || '') + '，' + v.sub);
      row.appendChild(info); row.appendChild(val);
      row.addEventListener('click', function () { openMs(v.it); });
      li.appendChild(row); list.appendChild(li);
    });
    updateMore();
  }
  function updateMore() {
    var l = $('mList');
    setText('mMore', l.scrollHeight > l.clientHeight + 2 ? '共 ' + ms.length + ' 项 · 可上下滑动' : '');
  }
  var msEditing = null;
  function msMode() {
    var up = $('mType').value === 'countup';
    $('mDateLabel').textContent = up ? '起始日期' : '目标日期';
    $('mIncWrap').hidden = !up;
  }
  function openMs(it, type) {
    msEditing = it ? it.id : null;
    $('mTitle').textContent = it ? '编辑日期' : '添加日期';
    $('mType').value = it ? it.type : (type || 'countdown');
    $('mName').value = it ? it.title : '';
    var d = new Date();
    if (!it && $('mType').value === 'countdown') d.setDate(d.getDate() + 30);
    $('mDate').value = it ? it.date : dayStr(d);
    $('mInc').checked = it ? it.includeStart : false;
    $('mErr').textContent = '';
    $('mDelete').hidden = !it;
    msMode();
    openDialog($('mOverlay'), $('mName'));
  }
  $('mAdd').addEventListener('click', function () { openMs(); });
  $('mType').addEventListener('change', msMode);
  $('mDelete').addEventListener('click', function () {
    ms = ms.filter(function (o) { return o.id !== msEditing; });
    saveMs(); renderMilestones(); renderCal(); closeDialog();
  });
  $('mForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('mName').value.trim(), date = $('mDate').value;
    if (!name) { $('mErr').textContent = '请填写一个名称。'; $('mName').focus(); return; }
    if (civilDay(date) === null) { $('mErr').textContent = '请选择有效日期（1900 到 9999 年）。'; $('mDate').focus(); return; }
    var item = { id: msEditing || uid(), type: $('mType').value, title: name.slice(0, 40), date: date, includeStart: $('mInc').checked };
    var i = -1;
    ms.forEach(function (o, idx) { if (o.id === msEditing) i = idx; });
    if (i === -1) ms.push(item); else ms[i] = item;
    saveMs(); renderMilestones(); renderCal(); closeDialog();
  });

  /* ---------- calendar ---------- */
  var view = { y: new Date().getFullYear(), m: new Date().getMonth() };
  function renderCal() {
    var y = view.y, m = view.m, today = dayStr(), marks = {};
    ms.forEach(function (it) { marks[it.date] = true; });
    $('calTitle').textContent = y + '年' + (m + 1) + '月';
    $('calMonth').textContent = String(m + 1);
    $('calYear').textContent = y + ' 年';
    var off = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((off + dim) / 7);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < rows * 7; i++) {
      var d = new Date(y, m, 1 - off + i), ds = dayStr(d), cls = 'd';
      if (d.getMonth() !== m) cls += ' out';
      var w = d.getDay();
      if (w === 0 || w === 6) cls += ' we';
      if (ds === today) cls += ' today';
      if (marks[ds]) cls += ' mark';
      var cell = el('div', cls); cell.appendChild(el('span', '', String(d.getDate()))); frag.appendChild(cell);
    }
    var box = $('days');
    box.textContent = '';
    box.appendChild(frag);
    box.style.setProperty('--rows', rows);
  }
  $('calPrev').addEventListener('click', function () { view.m -= 1; if (view.m < 0) { view.m = 11; view.y -= 1; } renderCal(); });
  $('calNext').addEventListener('click', function () { view.m += 1; if (view.m > 11) { view.m = 0; view.y += 1; } renderCal(); });
  $('calToday').addEventListener('click', function () { var n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); renderCal(); });

  /* ---------- tasks ---------- */
  var CHECK = '<i><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
  var CROSS = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function renderTasks() {
    var list = $('taskList');
    list.textContent = '';
    var tasks = st.tasks.slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
    if (!tasks.length) list.appendChild(el('li', 'empty', '今天还没有任务，在下方写下第一件事。'));
    tasks.forEach(function (t) {
      var li = el('li', 'task' + (t.done ? ' done' : '') + (t.id === st.focusId ? ' focus' : ''));
      li.setAttribute('data-id', t.id);
      var chk = el('button', 'chk'); chk.type = 'button'; chk.setAttribute('data-act', 'done');
      chk.setAttribute('aria-label', t.done ? '标为未完成' : '标为完成'); chk.setAttribute('aria-pressed', t.done ? 'true' : 'false');
      chk.innerHTML = CHECK;
      var tx = el('button', 'ttext'); tx.type = 'button'; tx.setAttribute('data-act', 'focus'); tx.title = '设为当前专注'; tx.disabled = t.done;
      tx.appendChild(el('span', 'fdot')); tx.appendChild(el('span', 'tl', t.text));
      var tp = el('span', 'tp'); if (t.pomos) { tp.textContent = '×' + t.pomos; tp.title = '已完成 ' + t.pomos + ' 轮专注'; }
      var del = el('button', 'del'); del.type = 'button'; del.setAttribute('data-act', 'del'); del.setAttribute('aria-label', '删除任务'); del.innerHTML = CROSS;
      li.appendChild(chk); li.appendChild(tx); li.appendChild(tp); li.appendChild(del);
      list.appendChild(li);
    });
    var done = st.tasks.filter(function (t) { return t.done; }).length, n = st.tasks.length;
    setText('taskCount', done + ' / ' + n);
    $('clearDone').disabled = !done;
  }
  function touch() { saveState(); renderTasks(); renderPomo(); }
  $('taskList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var li = b.closest('li'), id = li && li.getAttribute('data-id'), t = id && findTask(id);
    if (!t) return;
    var act = b.getAttribute('data-act');
    if (act === 'done') { t.done = !t.done; if (t.done && st.focusId === id) st.focusId = null; }
    else if (act === 'focus') { st.focusId = st.focusId === id ? null : id; }
    else if (act === 'del') { st.tasks = st.tasks.filter(function (x) { return x.id !== id; }); if (st.focusId === id) st.focusId = null; }
    touch();
  });
  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inp = $('taskInput'), v = inp.value.trim().slice(0, 80);
    if (!v) return;
    st.tasks.push({ id: uid(), text: v, done: false, pomos: 0 });
    inp.value = '';
    touch();
    inp.focus();
  });
  $('clearDone').addEventListener('click', function () {
    st.tasks = st.tasks.filter(function (t) { return !t.done; });
    if (st.focusId && !findTask(st.focusId)) st.focusId = null;
    touch();
  });

  /* ---------- pomodoro ---------- */
  var timer = (function () {
    var t = lsGet(K.timer) || {};
    var m = MODE_NAME[t.mode] ? t.mode : 'focus';
    var cfgTotal = cfg.lens[m] * 60000;
    var o = { mode: m, running: false, endAt: 0, left: cfgTotal, total: cfgTotal };
    if (t.running && typeof t.endAt === 'number' && isFinite(t.endAt) && t.endAt > 0) {
      o.running = true; o.endAt = t.endAt;
      o.total = typeof t.total === 'number' && t.total > 0 ? t.total : cfgTotal;
      o.left = Math.max(0, t.endAt - Date.now());
    } else if (typeof t.left === 'number' && t.left > 0 && t.left <= cfgTotal) { o.left = t.left; }
    return o;
  })();
  var pnote = '', flashT = 0;
  function saveTimer() { lsSet(K.timer, { mode: timer.mode, running: timer.running, endAt: timer.endAt, left: timer.left, total: timer.total }); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function renderRing() {
    var v = fmt(timer.left);
    if (last.pclock !== v) { last.pclock = v; $('pclock').textContent = v; $('pclock').setAttribute('aria-label', v.split(':')[0] + ' 分 ' + v.split(':')[1] + ' 秒'); }
    var frac = Math.max(0, Math.min(1, timer.left / timer.total));
    $('pLine').style.width = (frac * 100).toFixed(2) + '%';
    document.title = timer.running ? v + ' · ' + MODE_NAME[timer.mode] : TITLE;
  }
  function renderPomo() {
    var p = $('pomo');
    p.setAttribute('data-mode', timer.mode);
    Array.prototype.forEach.call(p.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === timer.mode ? 'true' : 'false');
      b.disabled = timer.running;
    });
    var full = timer.left >= timer.total - 500;
    setText('pGo', timer.running ? '暂停' : (full ? '开始' : '继续'));
    var ft = findTask(st.focusId), tg = $('ptarget');
    tg.textContent = '';
    if (ft) { tg.appendChild(document.createTextNode('当前专注：')); tg.appendChild(el('b', '', ft.text)); }
    else tg.textContent = '没有选任务。点任务名，就能设为当前专注。';
    var pn = $('pnote'); pn.hidden = !pnote; pn.textContent = pnote;
    var r = roundsToday(), n = r % 4, filled = (n === 0 && r > 0 && timer.mode === 'long') ? 4 : n;
    Array.prototype.forEach.call($('dots').children, function (d, i) { d.className = i < filled ? 'on' : ''; });
    setText('pCount', '今日 ' + r + ' 轮');
    renderRing();
  }
  var actx = null;
  function ensureAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep() {
    ensureAudio();
    if (!actx) return;
    try {
      var t0 = actx.currentTime;
      [0, 0.24, 0.48].forEach(function (o, i) {
        var osc = actx.createOscillator(), g = actx.createGain();
        osc.type = 'sine'; osc.frequency.value = i === 2 ? 988 : 784;
        g.gain.setValueAtTime(0.0001, t0 + o);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + o + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + 0.22);
        osc.connect(g); g.connect(actx.destination);
        osc.start(t0 + o); osc.stop(t0 + o + 0.24);
      });
    } catch (e) {}
  }
  function flash() {
    var p = $('pomo');
    p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
    clearTimeout(flashT);
    flashT = setTimeout(function () { p.classList.remove('flash'); }, 6000);
  }
  function setMode(m) { timer.mode = m; timer.running = false; timer.total = cfg.lens[m] * 60000; timer.left = timer.total; pnote = ''; saveTimer(); renderPomo(); }
  function start() {
    ensureAudio();
    if (timer.left <= 0) timer.left = timer.total;
    timer.endAt = Date.now() + timer.left;
    timer.running = true; pnote = '';
    saveTimer(); renderPomo(); renderSettings();
    if (cfg.wake) setWake(true);
  }
  function pause() { timer.left = Math.max(0, timer.endAt - Date.now()); timer.running = false; saveTimer(); renderPomo(); renderSettings(); }
  function complete() {
    var late = Date.now() - timer.endAt > 30000; /* finished while the iPad was asleep: log it, stay quiet */
    timer.running = false;
    var next;
    if (timer.mode === 'focus') {
      var c = recordFocus(Math.round(timer.total / 60000), timer.endAt);
      if (c.added && c.day === dayStr()) st.sessions += 1;
      if (c.day === dayStr()) st.sessions = Math.max(st.sessions, c.rounds);
      var t = findTask(st.focusId);
      if (t && c.added) t.pomos = (t.pomos || 0) + 1;
      next = c.rounds > 0 && c.rounds % 4 === 0 ? 'long' : 'short';
      pnote = '专注完成，休息 ' + cfg.lens[next] + ' 分钟';
      saveState(); renderTasks();
      if (openDlg === $('tOverlay')) renderStats();
    } else {
      next = 'focus';
      pnote = '休息结束，开始下一轮专注';
    }
    timer.mode = next; timer.total = cfg.lens[next] * 60000; timer.left = timer.total;
    saveTimer();
    if (!late) { if (cfg.sound) beep(); flash(); }
    renderPomo(); renderSettings();
  }
  $('pGo').addEventListener('click', function () { if (timer.running) pause(); else start(); });
  $('pReset').addEventListener('click', function () { timer.running = false; timer.total = cfg.lens[timer.mode] * 60000; timer.left = timer.total; pnote = ''; saveTimer(); renderPomo(); renderSettings(); });
  $('pSkip').addEventListener('click', function () { setMode(timer.mode === 'focus' ? 'short' : 'focus'); renderSettings(); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { if (!timer.running) { setMode(b.getAttribute('data-mode')); renderSettings(); } });
  });

  /* ---------- timer settings ---------- */
  var MINUS = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var PLUS = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function renderSettings() {
    var box = $('lenBox');
    box.textContent = '';
    ['focus', 'short', 'long'].forEach(function (m) {
      var row = el('div', 'lenrow');
      row.appendChild(el('span', '', MODE_NAME[m]));
      var s = el('div', 'stepper');
      var lock = timer.running && timer.mode === m;
      var dn = el('button'); dn.type = 'button'; dn.setAttribute('aria-label', '减少' + MODE_NAME[m] + '时长'); dn.innerHTML = MINUS; dn.disabled = lock || cfg.lens[m] <= MIN[m];
      var up = el('button'); up.type = 'button'; up.setAttribute('aria-label', '增加' + MODE_NAME[m] + '时长'); up.innerHTML = PLUS; up.disabled = lock || cfg.lens[m] >= MAX[m];
      var val = el('span', '', String(cfg.lens[m])); val.appendChild(el('em', '', '分钟'));
      dn.addEventListener('click', function () { stepLen(m, -1); });
      up.addEventListener('click', function () { stepLen(m, 1); });
      s.appendChild(dn); s.appendChild(val); s.appendChild(up);
      row.appendChild(s); box.appendChild(row);
    });
  }
  function stepLen(m, dir) {
    cfg.lens[m] = Math.max(MIN[m], Math.min(MAX[m], cfg.lens[m] + dir * STEP[m]));
    saveCfg();
    if (timer.mode === m && !timer.running) { timer.total = cfg.lens[m] * 60000; timer.left = timer.total; saveTimer(); renderPomo(); }
    renderSettings();
  }
  $('setOpen').addEventListener('click', function () { renderSettings(); openDialog($('sOverlay')); });

  /* ---------- wake lock + toggles ---------- */
  var wl = null;
  function setWake(on) {
    try {
      if (!navigator.wakeLock) return;
      if (on) {
        if (wl) return;
        navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }, function () { wl = null; });
      } else if (wl) { wl.release(); wl = null; }
    } catch (e) { wl = null; }
  }
  $('cWake').checked = cfg.wake;
  $('cSound').checked = cfg.sound;
  $('cWake').addEventListener('change', function () { cfg.wake = this.checked; saveCfg(); setWake(cfg.wake); });
  $('cSound').addEventListener('change', function () { cfg.sound = this.checked; saveCfg(); if (cfg.sound) { ensureAudio(); beep(); } });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (cfg.wake) setWake(true); tick(); }
  });
  document.addEventListener('pointerdown', function () { if (cfg.wake && !wl) setWake(true); }, { once: true });

  /* ---------- loop ---------- */
  var lastDay = dayStr();
  function tick() {
    var now = new Date();
    renderClock(now);
    var ds = dayStr(now);
    if (ds !== lastDay) {
      lastDay = ds;
      if (checkDay()) { renderTasks(); }
      renderCal(); renderMilestones(); renderPomo();
    }
    if (timer.running) {
      var left = timer.endAt - Date.now();
      if (left <= 0) { timer.left = 0; complete(); }
      else { timer.left = left; renderRing(); }
    }
  }
  window.addEventListener('resize', updateMore);

  checkDay();
  renderClock(new Date());
  renderCal();
  renderMilestones();
  renderTasks();
  renderPomo();
  renderSettings();
  setInterval(tick, 250);
  if (cfg.wake) setWake(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateMore);
})();
</script>
